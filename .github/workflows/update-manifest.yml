name: Update Version Manifest

on:
  release:
    types: [published]

jobs:
  update-manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout plugin repo (full history for diffing)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed to diff between tags

      - name: Get release info
        run: |
          echo "TAG=${{ github.event.release.tag_name }}" >> $GITHUB_ENV
          echo "PLUGIN=${{ github.event.repository.name }}" >> $GITHUB_ENV

      - name: Download release jar
        run: |
          ASSET_ID=$(echo '${{ toJson(github.event.release.assets) }}' \
            | jq -r '.[] | select(.name | endswith(".jar")) | .id' | head -1)

          if [ -z "$ASSET_ID" ]; then
            echo "ERROR: No .jar asset found in this release. Did you attach the jar?"
            exit 1
          fi

          JAR_NAME=$(echo '${{ toJson(github.event.release.assets) }}' \
            | jq -r '.[] | select(.name | endswith(".jar")) | .name' | head -1)

          JAR_URL="https://api.github.com/repos/${{ github.repository }}/releases/assets/$ASSET_ID"
          echo "JAR_URL=$JAR_URL" >> $GITHUB_ENV
          echo "Downloading asset ID: $ASSET_ID ($JAR_NAME)"

          curl -L -f -o plugin.jar \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "$JAR_URL"

          echo "Downloaded: $(ls -lh plugin.jar | awk '{print $5}')"

      - name: Compute SHA-256 checksum
        run: |
          CHECKSUM=$(sha256sum plugin.jar | awk '{print $1}')
          echo "CHECKSUM=$CHECKSUM" >> $GITHUB_ENV
          echo "Checksum: $CHECKSUM"

      - name: Generate player-friendly changelog
        run: |
          echo "=== Generating changelog for $PLUGIN $TAG ==="

          # ── Strategy 1: Git diff between tags ────────────────────────────────
          # Works great when there are 2+ tags — diffs actual Java source changes
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^$TAG$" | head -1)
          DIFF=""
          FILE_SUMMARY=""
          GEMINI_INPUT_TYPE=""

          if [ -n "$PREV_TAG" ]; then
            echo "Previous tag found: $PREV_TAG — using git diff strategy"
            GEMINI_INPUT_TYPE="diff"

            DIFF=$(git diff "$PREV_TAG" "$TAG" -- '*.java' | head -c 6000)
            FILE_SUMMARY=$(git diff --stat "$PREV_TAG" "$TAG" -- '*.java' | tail -20)

            echo "Files changed:"
            echo "$FILE_SUMMARY"

            if [ -z "$DIFF" ]; then
              echo "Git diff returned no Java changes between tags — switching to release notes strategy"
              GEMINI_INPUT_TYPE=""
            fi
          else
            echo "No previous tag found — this is the first release. Switching to release notes strategy."
          fi

          # ── Strategy 2: Use GitHub release notes ─────────────────────────────
          # Used when: first release (only one tag), or diff returned no Java changes
          # The developer writes release notes when publishing — Gemini translates them
          if [ -z "$GEMINI_INPUT_TYPE" ]; then
            echo "Fetching release notes from GitHub API..."
            GEMINI_INPUT_TYPE="notes"

            RELEASE_DATA=$(curl -s \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG")

            RELEASE_NOTES=$(echo "$RELEASE_DATA" | jq -r '.body // ""')

            echo "Release notes:"
            echo "$RELEASE_NOTES"

            if [ -z "$RELEASE_NOTES" ] || [ "$RELEASE_NOTES" = "null" ]; then
              echo "No release notes found either — using generic fallback."
              SUMMARY="✨ **$PLUGIN** has been updated with new features and improvements. Log on to check it out!"
              echo "CHANGELOG_SUMMARY<<EOF" >> $GITHUB_ENV
              echo "$SUMMARY" >> $GITHUB_ENV
              echo "EOF" >> $GITHUB_ENV
              exit 0
            fi
          fi

          # ── Call Gemini with whichever input we have ──────────────────────────
          echo "Calling Gemini with strategy: $GEMINI_INPUT_TYPE"

          if [ "$GEMINI_INPUT_TYPE" = "diff" ]; then
            GEMINI_PROMPT="You are writing a changelog for a Minecraft server Discord called FleaMC. You will be given a git diff of Java source code changes between two versions of a Minecraft plugin. Your job is to figure out what changed from a PLAYER perspective and write a short, exciting, player-friendly announcement.\n\nRules:\n- Use plain language players understand — no Java, no class names, no technical terms\n- Use emojis\n- Maximum 8 bullet points\n- Focus on what players will actually notice or experience\n- Do not mention version numbers\n- End with one short hype line encouraging players to log on\n- If the changes are mostly bug fixes, say so in a fun way\n- If you cannot determine what changed from a player perspective, write a generic exciting update message\n\nPlugin: $PLUGIN\n\nFiles changed:\n$FILE_SUMMARY\n\nCode diff:\n$DIFF"
          else
            GEMINI_PROMPT="You are writing a changelog for a Minecraft server Discord called FleaMC. You will be given developer release notes for a Minecraft plugin update. Your job is to rewrite them as a short, exciting, player-friendly announcement that players can actually understand.\n\nRules:\n- Use plain language players understand — no Java, no class names, no technical terms\n- Use emojis\n- Maximum 8 bullet points\n- Focus on what players will actually notice or experience\n- Do not mention version numbers\n- Do not mention technical implementation details like class names or file names\n- End with one short hype line encouraging players to log on\n- If the changes are mostly bug fixes, say so in a fun way\n\nPlugin: $PLUGIN\n\nDeveloper release notes:\n$RELEASE_NOTES"
          fi

          RESPONSE=$(curl -s \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${{ secrets.GEMINI_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg prompt "$GEMINI_PROMPT" \
              '{
                contents: [{
                  parts: [{ text: $prompt }]
                }],
                generationConfig: {
                  maxOutputTokens: 500,
                  temperature: 0.7
                }
              }')")

          echo "Gemini response:"
          echo "$RESPONSE" | jq '.'

          SUMMARY=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // ""')

          if [ -z "$SUMMARY" ] || [ "$SUMMARY" = "null" ]; then
            echo "Gemini returned empty — using fallback."
            SUMMARY="✨ **$PLUGIN** has been updated! Log on to check out what's new."
          fi

          echo "Generated summary:"
          echo "$SUMMARY"

          echo "CHANGELOG_SUMMARY<<EOF" >> $GITHUB_ENV
          echo "$SUMMARY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Checkout swag-versions repo
        uses: actions/checkout@v4
        with:
          repository: swag617/swag-versions
          token: ${{ secrets.VERSIONS_REPO_TOKEN }}
          path: swag-versions

      - name: Update versions.json
        run: |
          cd swag-versions

          jq empty versions.json || { echo "ERROR: versions.json is invalid JSON"; exit 1; }

          jq --arg plugin "$PLUGIN" \
             --arg version "$TAG" \
             --arg url "$JAR_URL" \
             --arg checksum "$CHECKSUM" \
             '.plugins[$plugin] = {version: $version, download: $url, checksum: $checksum}' \
             versions.json > versions.tmp.json

          jq empty versions.tmp.json || { echo "ERROR: jq produced invalid JSON"; exit 1; }

          mv versions.tmp.json versions.json

          echo "Updated $PLUGIN to $TAG"
          cat versions.json

      - name: Write changelog summary for Discord workflow
        run: |
          cd swag-versions

          # Write the generated summary to a temp file that the discord workflow will read
          # Named per-plugin so concurrent releases don't overwrite each other
          mkdir -p changelogs
          echo "$CHANGELOG_SUMMARY" > "changelogs/$PLUGIN.md"

          echo "Wrote changelog to changelogs/$PLUGIN.md"
          cat "changelogs/$PLUGIN.md"

      - name: Commit and push to swag-versions
        run: |
          cd swag-versions
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add versions.json "changelogs/$PLUGIN.md"

          git diff --staged --quiet && echo "No changes to commit" && exit 0

          # Include plugin name in commit message so discord workflow can detect it
          git commit -m "chore: update $PLUGIN to $TAG"
          git push
