name: SwagBounties
version: ${project.version}
main: com.swag.swagbounties.SwagBounties
api-version: '1.21'
authors: [SwagTeam]
description: Player bounty system with GUI, economy integration, and Discord webhooks
depend: [SwagAPI]
softdepend: [PlaceholderAPI]
# Vault removed from depend — SwagAPI's IEconomyService now handles economy (see SwagBounties#hookSwagAPI)
commands:
  bounty:
    description: Bounty commands
    usage: /bounty <set|add|remove|list|top|help> [args]
  bounties:
    description: Open the bounties GUI
    usage: /bounties
  bountyadmin:
    description: SwagBounties admin commands
    usage: /bountyadmin <config|remove|clear|clearall|give|inspect|reload> [args]
    permission: swagbounties.admin
permissions:
  swagbounties.admin:
    description: Access to SwagBounties admin commands
    default: op
